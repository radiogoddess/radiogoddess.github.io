    <style id="theme">
/**
 * I Saw The TV Glow ("The Pink Opaque" / Midnight Realm) Theme for Obsidian Slides Extended (Reveal.js)
 * Inspired by Jane Schoenbrun's I Saw the TV Glow (2024)
 * Palette: Neon Chalk Pink (#ff2a85 / #ff66b2), CRT Static Electric Blue (#38b6ff / #6ee7ff),
 *          Phosphor Lavender-White (#f5f0ff), and Midnight Realm Void (#080514 / #120924).
 */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600;1,700&family=Permanent+Marker&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=VT323&display=swap');

html * {
  color-profile: sRGB;
  rendering-intent: auto;
}

section.has-light-background,
section.has-light-background h1,
section.has-light-background h2,
section.has-light-background h3,
section.has-light-background h4,
section.has-light-background h5,
section.has-light-background h6 {
  color: #140a24;
}

/*********************************************
 * GLOBAL VARIABLES — THE PINK OPAQUE PALETTE
 *********************************************/
:root {
  /* Core Backgrounds */
  --r-background-color: #080514;
  --tv-bg-void: #080514;
  --tv-bg-midnight: #120926;
  --tv-bg-suburb: #091326;
  --tv-bg-asphalt: #0d0a18;

  /* Neon & Phosphor Accents (Trans Pride / CRT Glow Motifs) */
  --tv-pink-neon: #ff2a85;
  --tv-pink-chalk: #ff66b2;
  --tv-pink-soft: #ffb3d9;
  --tv-blue-static: #38b6ff;
  --tv-blue-cyan: #6ee7ff;
  --tv-purple-melancholy: #9d4edd;
  --tv-violet-glow: #c77dff;
  --tv-phosphor-white: #f5f0ff;
  --tv-muted-lavender: #b8a9d9;

  /* Typography */
  --tv-chalk-font: 'Permanent Marker', 'Chalkduster', 'Bradley Hand', 'Marker Felt', cursive, sans-serif;
  --tv-episode-serif: 'Cormorant Garamond', 'Didot', 'Baskerville', 'Georgia', serif;
  --tv-vhs-mono: 'VT323', 'Space Mono', 'Menlo', 'Courier New', monospace;
  --tv-body-sans: 'Plus Jakarta Sans', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  /* Reveal.js Standard Variables (tuned for 1280x720 16:9 canvas) */
  --r-main-font: var(--tv-body-sans);
  --r-main-font-size: 22px;
  --r-main-color: var(--tv-phosphor-white);
  --r-block-margin: 8px;
  --r-heading-margin: 0 0 10px 0;
  --r-heading-font: var(--tv-chalk-font);
  --r-heading-color: var(--tv-pink-chalk);
  --r-heading-line-height: 1.15;
  --r-heading-letter-spacing: 0.03em;
  --r-heading-text-transform: none;
  --r-heading-text-shadow: 0 0 12px rgba(255, 42, 133, 0.65), 0 0 28px rgba(255, 42, 133, 0.35);
  --r-heading-font-weight: 400;
  --r-heading1-text-shadow: 0 0 14px rgba(255, 42, 133, 0.8), 0 0 32px rgba(255, 42, 133, 0.45), 0 0 60px rgba(157, 78, 221, 0.3);
  --r-heading1-size: 1.9em;
  --r-heading2-size: 1.35em;
  --r-heading3-size: 1.12em;
  --r-heading4-size: 0.96em;
  --r-code-font: 'Space Mono', 'Menlo', 'Consolas', monospace;
  --r-link-color: var(--tv-blue-cyan);
  --r-link-color-dark: var(--tv-blue-static);
  --r-link-color-hover: var(--tv-pink-chalk);
  --r-selection-background-color: var(--tv-pink-neon);
  --r-selection-color: #ffffff;
  --r-overlay-element-bg-color: 18, 9, 38;
  --r-overlay-element-fg-color: 245, 240, 255;

  /* Semantic Text Highlights */
  --r-bold-color: var(--tv-pink-soft);
  --r-italic-color: var(--tv-blue-cyan);
  --r-inline-code-color: var(--tv-blue-cyan);
  --r-list-bullet-color: var(--tv-pink-neon);
}

/*********************************************
 * CRT TELEVISION VIEWPORT & SCANLINE GLOW
 *********************************************/
.reveal-viewport {
  background-color: var(--r-background-color);
  background-image:
    radial-gradient(ellipse at 50% 42%, rgba(255, 42, 133, 0.14) 0%, rgba(56, 182, 255, 0.10) 42%, rgba(8, 5, 20, 0.96) 80%),
    linear-gradient(135deg, #080514 0%, #130926 50%, #071324 100%);
}

/* Subtle CRT scanline & vignette overlay (non-blocking) */
.reveal-viewport::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0px,
      rgba(255, 255, 255, 0) 2px,
      rgba(0, 0, 0, 0.15) 3px,
      rgba(0, 0, 0, 0.15) 4px
    ),
    radial-gradient(circle at center, transparent 62%, rgba(3, 1, 10, 0.52) 100%);
}

.reveal {
  font-family: var(--r-main-font);
  font-size: var(--r-main-font-size);
  font-weight: 400;
  color: var(--r-main-color);
}

.reveal ::selection {
  color: var(--r-selection-color);
  background: var(--r-selection-background-color);
  text-shadow: none;
}

.reveal .slides section,
.reveal .slides section > section {
  line-height: 1.34;
  font-weight: inherit;
}

/*********************************************
 * LOCK SLIDE CONTENT TO TOP (CONSTANT HEADING HEIGHT)
 *********************************************/
/* Slides Extended wraps every slide in <div absolute="true" style="... justify-content: center">.
   Overriding justify-content to flex-start locks the VHS bar and H1 heading to the exact same
   vertical position across every slide, and prevents tall slides from clipping off the top/bottom. */
.reveal .slides section > div[absolute="true"],
.reveal .slides section > section > div[absolute="true"] {
  justify-content: flex-start !important;
  align-items: center !important;
  padding: 18px 28px 20px 28px !important;
  box-sizing: border-box !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

/*********************************************
 * HEADERS — CHALK PINK, PINK OPAQUE SERIF & VHS OSD
 *********************************************/
.reveal h1,
.reveal h2,
.reveal h3,
.reveal h4,
.reveal h5,
.reveal h6 {
  margin: var(--r-heading-margin);
  color: var(--r-heading-color);
  font-family: var(--r-heading-font);
  font-weight: var(--r-heading-font-weight);
  line-height: var(--r-heading-line-height);
  letter-spacing: var(--r-heading-letter-spacing);
  text-transform: var(--r-heading-text-transform);
  text-shadow: var(--r-heading-text-shadow);
  word-wrap: break-word;
}

/* H1: Scrawled Neon Pink Chalk Title Card Style — locked width & consistent top spacing */
.reveal h1 {
  font-family: var(--tv-chalk-font);
  font-size: var(--r-heading1-size);
  color: var(--tv-pink-chalk);
  text-shadow: var(--r-heading1-text-shadow);
  letter-spacing: 0.04em;
  width: 92%;
  text-align: center;
  margin-top: 2px;
  margin-bottom: 10px;
  flex-shrink: 0;
}

/* H2: "The Pink Opaque" 90s Supernatural Serif + Electric Blue TV Glow */
.reveal h2 {
  font-family: var(--tv-episode-serif);
  font-size: var(--r-heading2-size);
  font-weight: 700;
  font-style: italic;
  color: var(--tv-blue-cyan);
  letter-spacing: 0.02em;
  text-shadow: 0 0 12px rgba(56, 182, 255, 0.6), 0 0 26px rgba(56, 182, 255, 0.3);
  margin-bottom: 8px;
  flex-shrink: 0;
}

/* H3: VHS Broadcast Monospace Subheader */
.reveal h3 {
  font-family: var(--tv-vhs-mono);
  font-size: var(--r-heading3-size);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--tv-violet-glow);
  text-shadow: 0 0 10px rgba(199, 125, 255, 0.5);
  margin-bottom: 6px;
}

.reveal h4 {
  font-family: var(--tv-body-sans);
  font-size: var(--r-heading4-size);
  font-weight: 600;
  color: var(--tv-pink-soft);
  text-shadow: none;
  margin-bottom: 4px;
}

/*********************************************
 * BODY COPY, LISTS, QUOTES, CALLOUTS & TABLES
 *********************************************/
.reveal p {
  margin: 6px 0;
  line-height: 1.36;
  width: 90%;
  text-align: left;
}

.reveal strong,
.reveal b {
  font-weight: 700;
  color: var(--r-bold-color);
  text-shadow: 0 0 8px rgba(255, 42, 133, 0.35);
}

.reveal em,
.reveal i {
  font-style: italic;
  color: var(--r-italic-color);
}

.reveal mark {
  background: rgba(255, 42, 133, 0.28);
  color: #ffffff;
  padding: 0.08em 0.3em;
  border-radius: 3px;
  box-shadow: 0 0 10px rgba(255, 42, 133, 0.35);
}

.reveal ol,
.reveal dl,
.reveal ul {
  display: inline-block;
  text-align: left;
  margin: 4px 0 6px 1.1em;
  width: 88%;
}

.reveal split ol,
.reveal split dl,
.reveal split ul {
  width: 94%;
}

.reveal ul {
  list-style-type: disc;
}

.reveal ul li,
.reveal ol li {
  margin-bottom: 0.28em;
  line-height: 1.32;
}

.reveal ul li::marker,
.reveal ol li::marker {
  color: var(--r-list-bullet-color);
  text-shadow: 0 0 8px rgba(255, 42, 133, 0.7);
}

.reveal ul ul {
  list-style-type: circle;
  margin-top: 0.18em;
  margin-left: 1.2em;
  font-size: 0.92em;
  width: 96%;
}

.reveal ul ul li::marker {
  color: var(--tv-blue-cyan);
}

/* Blockquotes: "Sometimes The Pink Opaque feels more real than real life." */
.reveal blockquote {
  display: block;
  position: relative;
  width: 90%;
  margin: 6px auto;
  padding: 8px 16px;
  font-family: var(--tv-episode-serif);
  font-size: 1.08em;
  font-style: italic;
  color: var(--tv-phosphor-white);
  background: linear-gradient(90deg, rgba(255, 42, 133, 0.14) 0%, rgba(56, 182, 255, 0.08) 100%);
  border-left: 4px solid var(--tv-pink-neon);
  border-radius: 6px;
  box-shadow: 0 0 20px rgba(255, 42, 133, 0.15), inset 0 0 12px rgba(56, 182, 255, 0.08);
  text-align: left;
  box-sizing: border-box;
}

.reveal blockquote p {
  width: 100%;
  margin: 2px 0;
}

/* Obsidian Callouts Styled as CRT Broadcast / Pink Opaque Panels */
.reveal .callout {
  background: rgba(14, 8, 32, 0.82);
  border-radius: 6px;
  border: 1px solid rgba(var(--callout-color), 0.45);
  border-left: 4px solid rgb(var(--callout-color));
  box-shadow: 0 0 18px rgba(var(--callout-color), 0.16);
  margin: 6px auto;
  width: 90%;
  text-align: left;
  font-size: 0.86em;
  box-sizing: border-box;
}

.reveal .callout-title {
  font-family: var(--tv-vhs-mono);
  font-size: 1.05em;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 12px;
  background: rgba(var(--callout-color), 0.18);
  color: var(--tv-phosphor-white);
}

.reveal .callout-content {
  padding: 6px 14px;
}

.reveal .callout-content p {
  width: 100%;
  margin: 2px 0;
}

.callout-color1, .callout-color2 { --callout-color: 56, 182, 255; }
.callout-color6, .callout-color7 { --callout-color: 255, 42, 133; }
.callout-color8, .callout-color-default { --callout-color: 199, 125, 255; }

.reveal code {
  font-family: var(--r-code-font);
  font-size: 0.88em;
  color: var(--r-inline-code-color);
  background: rgba(56, 182, 255, 0.12);
  padding: 0.1em 0.35em;
  border-radius: 4px;
  border: 1px solid rgba(56, 182, 255, 0.28);
}

/* Tables */
.reveal table {
  margin: 6px auto;
  border-collapse: collapse;
  border-spacing: 0;
  width: 90%;
  font-size: 0.82em;
  background: rgba(18, 9, 38, 0.68);
  border: 1px solid rgba(255, 102, 178, 0.3);
  border-radius: 6px;
  overflow: hidden;
}

.reveal table th {
  font-family: var(--tv-vhs-mono);
  font-size: 1.12em;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--tv-pink-chalk);
  background: rgba(255, 42, 133, 0.16);
  border-bottom: 2px solid var(--tv-pink-neon);
  padding: 0.4em 0.7em;
  text-align: left;
}

.reveal table td {
  text-align: left;
  padding: 0.4em 0.7em;
  border-bottom: 1px solid rgba(184, 169, 217, 0.2);
  color: var(--tv-phosphor-white);
  vertical-align: top;
}

/*********************************************
 * FOOTNOTES (SLIDES EXTENDED [^1] SYNTAX)
 *********************************************/
.reveal sup[role="doc-noteref"] {
  font-family: var(--tv-vhs-mono);
  font-size: 0.72em;
  color: var(--tv-blue-cyan);
  text-shadow: 0 0 8px rgba(56, 182, 255, 0.7);
  margin-left: 2px;
  padding: 0 3px;
  background: rgba(56, 182, 255, 0.14);
  border-radius: 3px;
  vertical-align: super;
}

.reveal .footnotes {
  width: 90%;
  margin: auto auto 0 auto;
  padding-top: 6px;

        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }

                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }

# Plot

Owen (Justice Smith) is a socially awkward and introverted high school student who befriends Maddy (Jack Haven). They bond over their love of a *Buffy the Vampire Slayer*-like television show called <mark>*The Pink Opaque*</mark>. Owen identifying strongly with the character of Isabel and Maddy identifying more with Tara.

Eight years after Maddy disappears, she come back, claiming that *The Pink Opaque* is real and Maddy is actually Tara. Additionally, she claims Owen is actually Isabel, and Mr. Melancholy, the "big bad" of the show, has distorted her memories and has trapped her in "the Midnight Realm," just like in the final episode of the show. 

An allegory for trans repression, the majority of the film takes place during Owen's teenage years (Schoenbrun, 2024).

# Plot (Continued)

For the remainder of the presentation, I will be referring to the film's protagonist as Owen/Isabel.

# Social Justice Counseling

- Causes of a client's problems may not be internal, but external and systemic
- Minority stress (racial/gender/etc)
- Marginalization is intersectional
- Not a neutral stance
- Counselor work extends beyond the therapy session
- MSJCC Intervention Levels:
	- Micro:  Intrapersonal, Interpersonal
	- Meso:  Institutional, Community
	- Macro: Public Policy, International/Global

# Ways of Being: My Theoretical Orientation

- Relational / Person-centered, Trauma-Informed
    - Congruence, unconditional positive regard, accurate empathy
	- Warmth, genuineness/realness/presence
    - Acknowledging countertransference
    - Personality and sense of humor
	- Modeling secure attachment
- Mutuality
- Non-Pathologizing. Symptoms > Labels 
- Thoughtful emotional disclosure; broaching<sup id="fnref:broaching" role="doc-noteref">1</sup>
    - If it benefits the client

    - Can lead to psychoeducation; resources and information

# Multicultural and Social Justice Implications
## Social Pressures
- Struggles of late-in-life transition<sup id="fnref:social-context" role="doc-noteref">1</sup>
    - Resistance/rejection from spouse, family and friends
    - Employment discrimination
    - Difficulty finding community
- Co-transition (if partnered)<sup id="fnref:co-transition" role="doc-noteref">2</sup>
    - Partner may re-assess their own sexual (and sometimes gender) identity
- Mourning a sense of lost time<sup id="fnref:later-transition-check" role="doc-noteref">3</sup>
- Minority stress
    - Living in a country with restrictive anti-trans legislation
    - Access to gender affirming care and legal protections vary widely.

dow.location.origin !== event.origin && window.location.origin !== 'file://' ) {\n\t\t\t\t\t\treturn\n\t\t\t\t\t}\n\n\t\t\t\t\tclearTimeout( connectionTimeout );\n\t\t\t\t\tconnectionStatus.style.display = 'none';\n\n\t\t\t\t\tvar data = JSON.parse( event.data );\n\n\t\t\t\t\t// The overview mode is only useful to the reveal.js instance\n\t\t\t\t\t// where navigation occurs so we don't sync it\n\t\t\t\t\tif( data.state ) delete data.state.overview;\n\n\t\t\t\t\t// Messages sent by the notes plugin inside of the main window\n\t\t\t\t\tif( data && data.namespace === 'reveal-notes' ) {\n\t\t\t\t\t\tif( data.type === 'connect' ) {\n\t\t\t\t\t\t\thandleConnectMessage( data );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if( data.type === 'state' ) {\n\t\t\t\t\t\t\thandleStateMessage( data );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if( data.type === 'return' ) {\n\t\t\t\t\t\t\tpendingCalls[data.callId](data.result);\n\t\t\t\t\t\t\tdelete pendingCalls[data.callId];\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\t// Messages sent by the reveal.js inside of the current slide preview\n\t\t\t\t\telse if( data && data.namespace === 'reveal' ) {\n\t\t\t\t\t\tconst supportedEvents = [\n\t\t\t\t\t\t\t'slidechanged',\n\t\t\t\t\t\t\t'fragmentshown',\n\t\t\t\t\t\t\t'fragmenthidden',\n\t\t\t\t\t\t\t'paused',\n\t\t\t\t\t\t\t'resumed',\n\t\t\t\t\t\t\t'previewiframe',\n\t\t\t\t\t\t\t'previewimage',\n\t\t\t\t\t\t\t'previewvideo',\n\t\t\t\t\t\t\t'closeoverlay'\n\t\t\t\t\t\t];\n\n\t\t\t\t\t\tif( /ready/.test( data.eventName ) ) {\n\t\t\t\t\t\t\t// Send a message back to notify that the handshake is complete\n\t\t\t\t\t\t\twindow.opener.postMessage( JSON.stringify({ namespace: 'reveal-notes', type: 'connected'} ), '*' );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if( supportedEvents.includes( data.eventName ) && currentState !== JSON.stringify( data.state ) ) {\n\t\t\t\t\t\t\tdispatchStateToMainWindow( data.state );\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\n\t\t\t\t} );\n\n\t\t\t\t/**\n\t\t\t\t * Updates the presentation in the main window to match the state\n\t\t\t\t * of the presentation in the notes window.\n\t\t\t\t */\n\t\t\t\tconst dispatchStateToMainWindow = debounce(( state ) => {\n\t\t\t\t\twindow.opener.postMessage( JSON.stringify({ method: 'setState', args: [ state ]} ), '*' );\n\t\t\t\t}, 500);\n\n\t\t\t\t/**\n\t\t\t\t * Asynchronously calls the Reveal.js API of the main frame.\n\t\t\t\t */\n\t\t\t\tfunction callRevealApi( methodName, methodArguments, callback ) {\n\n\t\t\t\t\tvar callId = ++lastRevealApiCallId;\n\t\t\t\t\tpendingCalls[callId] = callback;\n\t\t\t\t\twindow.opener.postMessage( JSON.stringify( {\n\t\t\t\t\t\tnamespace: 'reveal-notes',\n\t\t\t\t\t\ttype: 'call',\n\t\t\t\t\t\tcallId: callId,\n\t\t\t\t\t\tmethodName: methodName,\n\t\t\t\t\t\targuments: methodArguments\n\t\t\t\t\t} ), '*' );\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * Called when the main window is trying to establish a\n\t\t\t\t * connection.\n\t\t\t\t */\n\t\t\t\tfunction handleConnectMessage( data ) {\n\n\t\t\t\t\tif( connected === false ) {\n\t\t\t\t\t\tconnected = true;\n\n\t\t\t\t\t\tsetupIframes( data );\n\t\t\t\t\t\tsetupKeyboard();\n\t\t\t\t\t\tsetupNotes();\n\t\t\t\t\t\tsetupTimer();\n\t\t\t\t\t\tsetupHeartbeat();\n\t\t\t\t\t}\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * Called when the main window sends an updated state.\n\t\t\t\t */\n\t\t\t\tfunction handleStateMessage( data ) {\n\n\t\t\t\t\t// Store the most recently set state to avoid circular loops\n\t\t\t\t\t// applying the same state\n\t\t\t\t\tcurrentState = JSON.stringify( data.state );\n\n\t\t\t\t\t// No need for updating the notes in case of fragment changes\n\t\t\t\t\tif ( data.notes ) {\n\t\t\t\t\t\tnotes.classList.remove( 'hidden' );\n\t\t\t\t\t\tnotesValue.style.whiteSpace = data.whitespace;\n\t\t\t\t\t\tif( data.markdown ) {\n\t\t\t\t\t\t\tnotesValue.innerHTML = marked( data.notes );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse {\n\t\t\t\t\t\t\tnotesValue.innerHTML = data.notes;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\telse {\n\t\t\t\t\t\tnotes.classList.add( 'hidden' );\n\t\t\t\t\t}\n\n\t\t\t\t\t// Don't show lightboxes in the upcoming slide\n\t\t\t\t\tconst { previewVideo, previewImage, previewIframe, ...upcomingState } = data.state;\n\n\t\t\t\t\t// Update the note slides\n\t\t\t\t\tcurrentSlide.contentWindow.postMessage( JSON.stringify({ method: 'setState', args: [ data.state ] }), '*' );\n\t\t\t\t\tupcomingSlide.contentWindow.postMessage( JSON.stringify({ method: 'setState', args: [ upcomingState ] }), '*' );\n\t\t\t\t\tupcomingSlide.contentWindow.postMessage( JSON.stringify({ method: 'next' }), '*' );\n\n\t\t\t\t}\n\n\t\t\t\t// Limit to max one state update per X ms\n\t\t\t\thandleStateMessage = debounce( handleStateMessage, 200 );\n\n\t\t\t\t/**\n\t\t\t\t * Forward keyboard events to the current slide window.\n\t\t\t\t * This enables keyboard events to work even if focus\n\t\t\t\t * isn't set on the current slide iframe.\n\t\t\t\t *\n\t\t\t\t * Block F5 default handling, it reloads and disconnects\n\t\t\t\t * the speaker notes window.\n\t\t\t\t */\n\t\t\t\tfunction setupKeyboard() {\n\n\t\t\t\t\tdocument.addEventListener( 'keydown', function( event ) {\n\t\t\t\t\t\tif( event.keyCode === 116 || ( event.metaKey && event.keyCode === 82 ) ) {\n\t\t\t\t\t\t\tevent.preventDefault();\n\t\t\t\t\t\t\treturn false;\n\t\t\t\t\t\t}\n\t\t\t\t\t\tcurrentSlide.contentWindow.postMessage( JSON.stringify({ method: 'triggerKey', args: [ event.keyCode ] }), '*' );\n\t\t\t\t\t} );\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * Creates the preview iframes.\n\t\t\t\t */\n\t\t\t\tfunction setupIframes( data ) {\n\n\t\t\t\t\tvar params = [\n\t\t\t\t\t\t'receiver',\n\t\t\t\t\t\t'progress=false',\n\t\t\t\t\t\t'history=false',\n\t\t\t\t\t\t'transition=none',\n\t\t\t\t\t\t'autoSlide=0',\n\t\t\t\t\t\t'backgroundTransition=none'\n\t\t\t\t\t].join( '&' );\n\n\t\t\t\t\tvar urlSeparator = /\\?/.test(data.url) ? '&' : '?';\n\t\t\t\t\tvar hash = '#/' + data.state.indexh + '/' + data.state.indexv;\n\t\t\t\t\tvar currentURL = data.url + urlSeparator + params + '&scrollActivationWidth=false&postMessageEvents=true' + hash;\n\t\t\t\t\tvar upcomingURL = data.url + urlSeparator + params + '&scrollActivationWidth=false&controls=false' + hash;\n\n\t\t\t\t\tcurrentSlide = document.createElement( 'iframe' );\n\t\t\t\t\tcurrentSlide.setAttribute( 'width', 1280 );\n\t\t\t\t\tcurrentSlide.setAttribute( 'height', 1024 );\n\t\t\t\t\tcurrentSlide.setAttribute( 'src', currentURL );\n\t\t\t\t\tdocument.querySelector( '#current-slide' ).appendChild( currentSlide );\n\n\t\t\t\t\tupcomingSlide = document.createElement( 'iframe' );\n\t\t\t\t\tupcomingSlide.setAttribute( 'width', 640 );\n\t\t\t\t\tupcomingSlide.setAttribute( 'height', 512 );\n\t\t\t\t\tupcomingSlide.setAttribute( 'src', upcomingURL );\n\t\t\t\t\tdocument.querySelector( '#upcoming-slide' ).appendChild( upcomingSlide );\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * Setup the notes UI.\n\t\t\t\t */\n\t\t\t\tfunction setupNotes() {\n\n\t\t\t\t\tnotes = document.querySelector( '.speaker-controls-notes' );\n\t\t\t\t\tnotesValue = document.querySelector( '.speaker-controls-notes .value' );\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * We send out a heartbeat at all times to ensure we can\n\t\t\t\t * reconnect with the main presentation window after reloads.\n\t\t\t\t */\n\t\t\t\tfunction setupHeartbeat() {\n\n\t\t\t\t\tsetInterval( () => {\n\t\t\t\t\t\twindow.opener.postMessage( JSON.stringify({ namespace: 'reveal-notes', type: 'heartbeat'} ), '*' );\n\t\t\t\t\t}, 1000 );\n\n\t\t\t\t}\n\n\t\t\t\tfunction getTimings( callback ) {\n\n\t\t\t\t\tcallRevealApi( 'getSlidesAttributes', [], function ( slideAttributes ) {\n\t\t\t\t\t\tcallRevealApi( 'getConfig', [], function ( config ) {\n\t\t\t\t\t\t\tvar totalTime = config.totalTime;\n\t\t\t\t\t\t\tvar minTimePerSlide = config.minimumTimePerSlide || 0;\n\t\t\t\t\t\t\tvar defaultTiming = config.defaultTiming;\n\t\t\t\t\t\t\tif ((defaultTiming == null) && (totalTime == null)) {\n\t\t\t\t\t\t\t\tcallback(null);\n\t\t\t\t\t\t\t\treturn;\n\t\t\t\t\t\t\t     <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: false,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom
            plugins: [
                ObsidianMarkdown,

                RevealZoom,
                RevealNotes,

            ],
            allottedTime: "120",

            katex: {
                local: 'plugin/math/katex',
                extensions: ["mhchem"],
            },
            markdown: {
                gfm: true,
            },
            mermaid: {
                theme: isLight(bgColor) ? 'default' : 'dark',
            },
            customcontrols: {
                controls: [
                ]
            },
        };

        if ( pageInIframe() ) {
            defaultOptions.scrollActivationWidth = 5;
        }

        // options from URL query string
        const queryOptions = Reveal().getQueryHash() || {};

        const options = extend(defaultOptions, {"controls":true,"progress":false,"slideNumber":false,"center":false,"transition":"fade","transitionSpeed":"default","width":1280,"height":720,"margin":0.04}, queryOptions);
    </script>
